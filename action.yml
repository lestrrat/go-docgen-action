name: docgen
description: Generate Markdown API documentation for a Go module with docgen.
author: lestrrat
branding:
  icon: book-open
  color: blue

inputs:
  version:
    description: docgen version to install (a tag, branch, commit, or "latest").
    default: latest
  go-version:
    description: >-
      Go version to install. Empty reads the version from module-dir/go.mod,
      so docgen is built with a toolchain at least as new as the module needs.
    default: ""
  module-dir:
    description: Module root; must contain go.mod.
    default: "."
  out:
    description: Output directory. A relative path is joined with module-dir.
    default: docs
  check:
    description: >-
      When "true", write nothing and fail if the committed docs differ
      from freshly generated ones.
    default: "false"
  tags:
    description: Comma-separated build tags.
    default: ""
  goos:
    description: GOOS for the build context. Empty uses the docgen default.
    default: ""
  goarch:
    description: GOARCH for the build context. Empty uses the docgen default.
    default: ""
  source-ref:
    description: Enable GitHub source links at this ref.
    default: ""
  source-base-url:
    description: Enable source links under this base URL.
    default: ""

outputs:
  changed:
    description: >-
      "true" if generating changed files under the output directory,
      "false" if not, empty in check mode or when module-dir is not in a git repository.
    value: ${{ steps.run.outputs.changed }}
  cache-hit:
    description: >-
      "true" if the docgen binary came from the cache, "false" if it was
      built, empty if the version is not cacheable.
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      id: go
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.module-dir }}/go.mod
        cache: false

    # A tag or commit never changes, so its binary is safe to cache.
    # A branch name or "latest" moves, so those are always rebuilt.
    - name: Check whether the docgen version is cacheable
      id: ver
      shell: bash
      env:
        DOCGEN_VERSION: ${{ inputs.version }}
      run: |
        if [[ "$DOCGEN_VERSION" =~ ^v[0-9] || "$DOCGEN_VERSION" =~ ^[0-9a-f]{7,40}$ ]]; then
          echo "cacheable=true" >> "$GITHUB_OUTPUT"
        else
          echo "cacheable=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore the docgen binary
      id: cache
      if: steps.ver.outputs.cacheable == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/docgen-bin
        key: docgen-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ inputs.version }}

    - name: Install docgen
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DOCGEN_VERSION: ${{ inputs.version }}
        GOBIN: ${{ runner.temp }}/docgen-bin
      run: go install "github.com/lestrrat-go/docgen/cmd/docgen@${DOCGEN_VERSION}"

    - name: Run docgen
      id: run
      shell: bash
      env:
        MODULE_DIR: ${{ inputs.module-dir }}
        OUT: ${{ inputs.out }}
        CHECK: ${{ inputs.check }}
        TAGS: ${{ inputs.tags }}
        GOOS_INPUT: ${{ inputs.goos }}
        GOARCH_INPUT: ${{ inputs.goarch }}
        SOURCE_REF: ${{ inputs.source-ref }}
        SOURCE_BASE_URL: ${{ inputs.source-base-url }}
        DOCGEN_BIN: ${{ runner.temp }}/docgen-bin/docgen
      run: |
        set -euo pipefail
        args=(--module-dir "$MODULE_DIR" --out "$OUT")
        [ -n "$TAGS" ] && args+=(--tags "$TAGS")
        [ -n "$GOOS_INPUT" ] && args+=(--goos "$GOOS_INPUT")
        [ -n "$GOARCH_INPUT" ] && args+=(--goarch "$GOARCH_INPUT")
        [ -n "$SOURCE_REF" ] && args+=(--source-ref "$SOURCE_REF")
        [ -n "$SOURCE_BASE_URL" ] && args+=(--source-base-url "$SOURCE_BASE_URL")

        if [ "$CHECK" = "true" ]; then
          "$DOCGEN_BIN" "${args[@]}" --check
          exit 0
        fi

        "$DOCGEN_BIN" "${args[@]}"

        if git -C "$MODULE_DIR" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          if [ -n "$(git -C "$MODULE_DIR" status --porcelain --untracked-files=all -- "$OUT")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        fi
